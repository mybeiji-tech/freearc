name: Build FreeArc (Windows)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: freearc-src

    - name: Set up hardcoded directory structure
      shell: cmd
      run: |
        echo "Creating hardcoded paths required by Makefile..."
        :: 注意：这里去掉了预先创建 GHC 目录的命令，避免触发安装包的覆盖询问弹窗
        mkdir "C:\!\FreeArchiver"
        xcopy /E /I /H /Y "%GITHUB_WORKSPACE%\freearc-src\*" "C:\!\FreeArchiver\"

    - name: Install Make
      shell: cmd
      run: |
        choco install make --yes

    - name: Download and Install GHC 6.10.3
      shell: cmd
      run: |
        curl -L "https://downloads.haskell.org/~ghc/6.10.3/ghc-6.10.3-i386-windows.exe" -o ghc-installer.exe
        echo "Extracting GHC bypassing installer GUI..."
        :: 暴力解压代替执行安装包，100% 杜绝 CI 环境后台卡死
        7z x ghc-installer.exe -o"C:\Base\Compiler\ghc" -y

    - name: Download and Install Gtk2Hs 0.10.1
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;%PATH%
        curl -L "https://sourceforge.net/projects/gtk2hs/files/gtk2hs/0.10.1/gtk2hs-0.10.1-win32-installer.exe/download" -o gtk2hs.exe
        :: 使用 start /wait 确保在无头服务器中静默执行完毕再进入下一步
        start /wait "" gtk2hs.exe /S

    - name: Download and Extract 7-zip 9.10 sources
      shell: cmd
      run: |
        curl -L "https://sourceforge.net/projects/sevenzip/files/7-Zip/9.10%20beta/7z910.tar.bz2/download" -o 7z910.tar.bz2
        mkdir "C:\!\FreeArchiver\7zip"
        7z x 7z910.tar.bz2 -o"C:\!\FreeArchiver\7zip"
        7z x "C:\!\FreeArchiver\7zip\7z910.tar" -o"C:\!\FreeArchiver\7zip" -y

    - name: Compile HsLua
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;%PATH%
        cd "C:\!\FreeArchiver\HsLua"
        make

    - name: Compile SFX modules, Unarc.exe, Unarc.dll and FAR plugin
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;%PATH%
        cd "C:\!\FreeArchiver\Unarc"
        make

    - name: Compile console version (Arc.exe)
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;%PATH%
        cd "C:\!\FreeArchiver"
        call compile-O2.cmd

    - name: Compile GUI version (FreeArc.exe)
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;%PATH%
        cd "C:\!\FreeArchiver"
        call compile-GUI-O2.cmd

    - name: Upload Artifacts (Exe and Dll)
      uses: actions/upload-artifact@v4
      with:
        name: FreeArc-Windows-Binaries
        path: |
          C:\!\FreeArchiver\Tests\Arc.exe
          C:\!\FreeArchiver\Tests\FreeArc.exe
          C:\!\FreeArchiver\Unarc\Unarc.exe
          C:\!\FreeArchiver\Unarc\Unarc.dll

name: Build FreeArc (Windows)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: freearc-src

    - name: Set up hardcoded directory structure
      shell: cmd
      run: |
        echo "Creating hardcoded paths required by Makefile..."
        mkdir "C:\!\FreeArchiver"
        xcopy /E /I /H /Y "%GITHUB_WORKSPACE%\freearc-src\*" "C:\!\FreeArchiver\"

    - name: Install Build Tools (Make and InnoUnp)
      shell: cmd
      run: |
        choco install make --yes
        :: 安装 innounp 用来强行解压一切顽固的 Inno Setup 安装包
        choco install innounp --yes

    - name: Download and Install GHC 6.10.3
      shell: cmd
      run: |
        curl -L "https://downloads.haskell.org/~ghc/6.10.3/ghc-6.10.3-i386-windows.exe" -o ghc-installer.exe
        echo "Installing GHC..."
        mkdir "C:\Base\Compiler\ghc"
        start /wait "" ghc-installer.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="C:\Base\Compiler\ghc" /S /D=C:\Base\Compiler\ghc

    - name: Extract and Manually Register Gtk2Hs 0.10.1
      shell: cmd
      run: |
        curl -L "https://sourceforge.net/projects/gtk2hs/files/gtk2hs/0.10.1/gtk2hs-0.10.1-win32-installer.exe/download" -o gtk2hs.exe
        mkdir "C:\Base\Compiler\gtk2hs"
        
        echo "Forcing extraction of Gtk2Hs using innounp..."
        cd /d "C:\Base\Compiler\gtk2hs"
        innounp -x -y "%GITHUB_WORKSPACE%\gtk2hs.exe"
        
        :: 很多时候 innounp 会把文件解压到 {app} 文件夹下，将其规范化
        if exist "{app}" (
            xcopy /E /I /H /Y "{app}\*" ".\"
            rd /S /Q "{app}"
        )
        
        echo "Manually registering Gtk2Hs into GHC package database..."
        set PATH=C:\Base\Compiler\ghc\bin;%PATH%
        
        :: 寻找解压出来的 .conf 或者是通过 ghc-pkg 直接注册。
        if exist "register.bat" (
            call register.bat
        ) else if exist "lib\import" (
            echo "Generating manual package registration if needed..."
            for /r %%i in (*.conf) do ghc-pkg register "%%i" --force
        )

    - name: Download and Extract 7-zip 9.10 sources
      shell: cmd
      run: |
        :: 修复 SourceForge 下载链接，使用 downloads API 并伪装 User-Agent，防止下载到 HTML 网页
        curl -L -A "Mozilla/5.0" "https://downloads.sourceforge.net/project/sevenzip/7-Zip/9.10%20beta/7z910.tar.bz2" -o 7z910.tar.bz2
        mkdir "C:\!\FreeArchiver\7zip"
        7z x 7z910.tar.bz2 -o"C:\!\FreeArchiver\7zip"
        7z x "C:\!\FreeArchiver\7zip\7z910.tar" -o"C:\!\FreeArchiver\7zip" -y

    - name: Compile HsLua
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;C:\Base\Compiler\gtk2hs\bin;%PATH%
        cd "C:\!\FreeArchiver\HsLua"
        make

    - name: Compile SFX modules, Unarc.exe, Unarc.dll and FAR plugin
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;C:\Base\Compiler\gtk2hs\bin;%PATH%
        cd "C:\!\FreeArchiver\Unarc"
        make

    - name: Compile console version (Arc.exe)
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;C:\Base\Compiler\gtk2hs\bin;%PATH%
        cd "C:\!\FreeArchiver"
        call compile-O2.cmd

    - name: Compile GUI version (FreeArc.exe)
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;C:\Base\Compiler\gtk2hs\bin;%PATH%
        cd "C:\!\FreeArchiver"
        call compile-GUI-O2.cmd

    - name: Upload Artifacts (Exe and Dll)
      uses: actions/upload-artifact@v4
      with:
        name: FreeArc-Windows-Binaries
        path: |
          C:\!\FreeArchiver\Tests\Arc.exe
          C:\!\FreeArchiver\Tests\FreeArc.exe
          C:\!\FreeArchiver\Unarc\Unarc.exe
          C:\!\FreeArchiver\Unarc\Unarc.dll

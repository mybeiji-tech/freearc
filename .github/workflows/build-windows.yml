name: Build FreeArc (Windows)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: freearc-src
        submodules: recursive
        fetch-depth: 0

    - name: Setup Hardcoded Directories dynamically from Source
      shell: powershell
      run: |
        Write-Host "Creating FreeArchiver root and copying source..."
        New-Item -ItemType Directory -Path "C:\!\FreeArchiver" -Force | Out-Null
        Copy-Item -Path "$env:GITHUB_WORKSPACE\freearc-src\*" -Destination "C:\!\FreeArchiver\" -Recurse -Force
        
        Write-Host "Generating common.mak for Windows compilation..."
        Copy-Item "C:\!\FreeArchiver\win32-common.mak" "C:\!\FreeArchiver\common.mak" -Force

        Write-Host "Scanning all Makefiles to dynamically create ALL missing c:/temp/out/* directories..."
        $regex = "(?i)[c]:/temp/out/([a-zA-Z0-9_-]+)"
        Get-ChildItem -Path "C:\!\FreeArchiver" -Recurse -Include *.mak, Makefile, *.cmd -ErrorAction SilentlyContinue | ForEach-Object {
            $content = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
            if ($content -match $regex) {
                $matches = [regex]::Matches($content, $regex)
                foreach ($m in $matches) {
                    $dir = "C:\temp\out\" + $m.Groups[1].Value
                    if (-not (Test-Path $dir)) {
                        New-Item -ItemType Directory -Path $dir -Force | Out-Null
                        Write-Host "Dynamically created temp dir based on source code: $dir"
                    }
                }
            }
        }
        
        # 显式兜底机制：万一正则漏了，强行建好已知的几个常客
        $explicitDirs = @("FreeArc-unarc", "FreeArc", "HsLua", "FreeArc-gui", "Arc", "FreeArc-sfx")
        foreach ($d in $explicitDirs) {
            New-Item -ItemType Directory -Path "C:\temp\out\$d" -Force | Out-Null
        }

    - name: Install Build Tools (Make and InnoUnp)
      shell: cmd
      run: |
        choco install make innounp --yes

    - name: Download and Install GHC 6.10.3
      shell: cmd
      run: |
        curl -L "https://downloads.haskell.org/~ghc/6.10.3/ghc-6.10.3-i386-windows.exe" -o ghc-installer.exe
        mkdir "C:\Base\Compiler\ghc"
        start /wait "" ghc-installer.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="C:\Base\Compiler\ghc" /S /D=C:\Base\Compiler\ghc

    - name: Fix Hardcoded MinGW Tool Paths for Makefiles
      shell: powershell
      run: |
        Write-Host "Fixing tools hardcoded to C:\Base\Compiler\ghc\ in FreeArc Makefiles..."
        $tools = @("windres.exe", "ar.exe", "ld.exe", "strip.exe", "dllwrap.exe", "gcc.exe")
        foreach ($tool in $tools) {
            $dest = "C:\Base\Compiler\ghc\$tool"
            
            # 第一优先级：从 GHC 安装目录深处挖出来
            $found = Get-ChildItem -Path "C:\Base\Compiler\ghc" -Filter $tool -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            
            # 第二优先级：如果 GHC 没带，从 Windows Runner 系统的预装环境(如系统的 MinGW)中拉取
            if (-not $found) {
                $sysPath = (where.exe $tool 2>$null | Select-Object -First 1)
                if ($sysPath) {
                    $found = Get-Item $sysPath
                }
            }
            
            if ($found) {
                Copy-Item -Path $found.FullName -Destination $dest -Force
                Write-Host "Fixed Tool Path: $($found.FullName) -> $dest"
            } else {
                Write-Host "Warning: $tool not found anywhere! Compilation might fail if Make calls it directly."
            }
        }

    - name: Extract and Manually Register Gtk2Hs 0.10.1
      shell: cmd
      run: |
        echo "Using direct mirrors and Web Archive fallback for Gtk2Hs..."
        curl -L "https://jaist.dl.sourceforge.net/project/gtk2hs/gtk2hs/0.10.1/gtk2hs-0.10.1-win32-installer.exe" -o gtk2hs.exe || curl -L "https://master.dl.sourceforge.net/project/gtk2hs/gtk2hs/0.10.1/gtk2hs-0.10.1-win32-installer.exe" -o gtk2hs.exe || curl -L "https://web.archive.org/web/20130605051936/http://downloads.sourceforge.net/project/gtk2hs/gtk2hs/0.10.1/gtk2hs-0.10.1-win32-installer.exe" -o gtk2hs.exe
        
        mkdir "C:\Base\Compiler\gtk2hs"
        echo "Forcing extraction of Gtk2Hs using innounp..."
        cd /d "C:\Base\Compiler\gtk2hs"
        innounp -x -y "%GITHUB_WORKSPACE%\gtk2hs.exe"
        
        if exist "{app}" (
            xcopy /E /I /H /Y "{app}\*" ".\"
            rd /S /Q "{app}"
        )
        
        echo "Manually registering Gtk2Hs into GHC package database..."
        set PATH=C:\Base\Compiler\ghc\bin;%PATH%
        
        if exist "register.bat" (
            call register.bat
        ) else if exist "lib\import" (
            for /r %%i in (*.conf) do ghc-pkg register "%%i" --force
        )

    - name: Extract Local 7-zip 9.10 sources
      shell: cmd
      run: |
        echo "Using locally provided 7z910.tar.bz2 from repository to bypass network issues..."
        mkdir "C:\!\FreeArchiver\7zip"
        7z x "%GITHUB_WORKSPACE%\freearc-src\src\7z910.tar.bz2" -o"C:\!\FreeArchiver\7zip" -y
        7z x "C:\!\FreeArchiver\7zip\7z910.tar" -o"C:\!\FreeArchiver\7zip" -y

    - name: Compile HsLua
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;C:\Base\Compiler\gtk2hs\bin;%PATH%
        cd /d "C:\!\FreeArchiver\HsLua"
        make

    - name: Compile SFX modules, Unarc.exe, Unarc.dll and FAR plugin
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;C:\Base\Compiler\gtk2hs\bin;%PATH%
        cd /d "C:\!\FreeArchiver\Unarc"
        make

    - name: Compile console version (Arc.exe)
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;C:\Base\Compiler\gtk2hs\bin;%PATH%
        cd /d "C:\!\FreeArchiver"
        call compile-O2.cmd

    - name: Compile GUI version (FreeArc.exe)
      shell: cmd
      run: |
        set PATH=C:\Base\Compiler\ghc\bin;C:\Base\Compiler\gtk2hs\bin;%PATH%
        cd /d "C:\!\FreeArchiver"
        call compile-GUI-O2.cmd

    - name: Upload Artifacts (Exe and Dll)
      uses: actions/upload-artifact@v4
      with:
        name: FreeArc-Windows-Binaries
        path: |
          C:\!\FreeArchiver\Tests\Arc.exe
          C:\!\FreeArchiver\Tests\FreeArc.exe
          C:\!\FreeArchiver\Unarc\Unarc.exe
          C:\!\FreeArchiver\Unarc\Unarc.dll
